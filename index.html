<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPT Image 2.0 生成器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;700&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0a0a0f; --surface: #13131a; --border: #2a2a3a;
    --accent: #7c6af7; --accent2: #f7c76a;
    --text: #e8e8f0; --muted: #6b6b80;
    --success: #6af7a0; --error: #f76a6a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }

  .header { text-align: center; margin-bottom: 32px; }
  .header h1 { font-family: 'Space Mono', monospace; font-size: 2rem; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
  .header p { color: var(--muted); font-size: 0.9rem; }

  .tabs { width: 100%; max-width: 680px; display: flex; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
  .tab-btn { flex: 1; padding: 12px; border: none; font-family: 'Space Mono', monospace; font-size: 0.85rem; cursor: pointer; transition: background 0.2s, color 0.2s; }
  .tab-btn.active { background: var(--accent); color: #fff; }
  .tab-btn.inactive { background: var(--surface); color: var(--muted); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 22px; width: 100%; max-width: 680px; margin-bottom: 20px; }

  .label { font-size: 0.75rem; font-family: 'Space Mono', monospace; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; display: block; }

  input[type="password"], textarea, select { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'Noto Sans TC', sans-serif; font-size: 0.95rem; padding: 10px 14px; outline: none; transition: border-color 0.2s; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 90px; line-height: 1.6; }
  select option { background: var(--surface); }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  .field { display: flex; flex-direction: column; }

  .key-row { display: flex; gap: 8px; align-items: center; }
  .key-row input { flex: 1; }
  .save-btn { padding: 10px 14px; background: var(--accent); border: none; border-radius: 8px; color: #fff; font-family: 'Space Mono', monospace; font-size: 0.78rem; cursor: pointer; white-space: nowrap; transition: opacity 0.2s; }
  .save-btn:hover { opacity: 0.85; }

  .tip { font-size: 0.76rem; color: var(--muted); margin-top: 5px; }
  .saved-tag { font-size: 0.75rem; color: var(--success); margin-top: 5px; display: none; }

  .upload-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; padding: 10px 14px; background: var(--bg); border: 1px dashed var(--border); border-radius: 8px; cursor: pointer; transition: border-color 0.2s; }
  .upload-row:hover { border-color: var(--accent); }
  .upload-text { font-size: 0.85rem; color: var(--muted); }
  .preview-thumb { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); flex-shrink: 0; }
  .clear-btn { margin-left: auto; padding: 4px 10px; background: var(--error); border: none; border-radius: 5px; color: #fff; font-size: 0.75rem; cursor: pointer; flex-shrink: 0; }

  button.generate { width: 100%; max-width: 680px; padding: 15px; background: linear-gradient(135deg, var(--accent), #5a4fd4); border: none; border-radius: 12px; color: #fff; font-family: 'Space Mono', monospace; font-size: 1rem; font-weight: 700; letter-spacing: 0.05em; cursor: pointer; transition: opacity 0.2s, transform 0.1s; margin-bottom: 20px; }
  button.generate:hover { opacity: 0.9; }
  button.generate:active { transform: scale(0.98); }
  button.generate:disabled { opacity: 0.4; cursor: not-allowed; }

  .status { width: 100%; max-width: 680px; text-align: center; font-size: 0.9rem; min-height: 22px; margin-bottom: 14px; }
  .status.loading { color: var(--accent2); }
  .status.error { color: var(--error); }
  .status.success { color: var(--success); }

  .result { width: 100%; max-width: 680px; }
  .result img { width: 100%; border-radius: 12px; border: 1px solid var(--border); display: block; }

  .result-actions { display: flex; gap: 10px; margin-top: 12px; }
  .download-btn, .continue-btn { flex: 1; display: block; padding: 12px; border-radius: 8px; font-family: 'Space Mono', monospace; font-size: 0.82rem; text-align: center; cursor: pointer; transition: background 0.2s; text-decoration: none; border: 1px solid var(--accent); }
  .download-btn { background: var(--surface); color: var(--accent); }
  .download-btn:hover { background: var(--accent); color: #fff; }
  .continue-btn { background: var(--surface); color: var(--accent2); border-color: var(--accent2); }
  .continue-btn:hover { background: var(--accent2); color: #000; }

  .share-row { display: flex; gap: 10px; margin-top: 10px; }
  .share-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 8px; border-radius: 8px; font-family: "Noto Sans TC", sans-serif; font-size: 0.82rem; text-align: center; cursor: pointer; transition: opacity 0.2s; text-decoration: none; border: none; font-weight: 500; }
  .share-btn:hover { opacity: 0.85; }
  .share-line { background: #06C755; color: #fff; }
  .share-fb { background: #1877F2; color: #fff; }
  .share-tw { background: #000; color: #fff; }
  .share-copy { background: var(--surface); color: var(--text); border: 1px solid var(--border) !important; }

  .history-label { font-size: 0.75rem; color: var(--muted); margin-top: 16px; margin-bottom: 8px; font-family: 'Space Mono', monospace; }

  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="header">
  <h1>GPT Image 2.0</h1>
  <p>透過 OpenAI API 在瀏覽器直接生成／編輯圖片</p>
</div>

<div class="card">
  <label class="label">🔑 OpenAI API Key</label>
  <div class="key-row">
    <input type="password" id="apiKey" placeholder="sk-proj-..." />
    <button class="save-btn" onclick="saveKey()">記住 Key</button>
  </div>
  <p class="tip">Key 只存在你的瀏覽器，不會上傳到任何伺服器</p>
  <p class="saved-tag" id="savedTag"></p>
</div>

<div class="tabs">
  <button class="tab-btn active" id="tabGenerate" onclick="switchTab('generate')">✦ 生成圖片</button>
  <button class="tab-btn inactive" id="tabEdit" onclick="switchTab('edit')">✎ 編輯圖片</button>
</div>

<div class="card">
  <div id="uploadSection" style="display:none;">
    <label class="label">🖼️ 上傳原圖</label>
    <div class="upload-row" id="uploadRow" onclick="document.getElementById('imageInput').click()">
      <span style="font-size:1.4rem">📁</span>
      <div class="upload-text">點擊選擇圖片（PNG / JPG）</div>
      <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="previewImage(event)"/>
    </div>
  </div>

  <label class="label">✏️ <span id="promptLabel">圖片描述（Prompt）</span></label>
  <textarea id="prompt" placeholder="例如：台灣阿里山的茶園，清晨薄霧，油畫風格，高品質"></textarea>

  <div class="row">
    <div class="field">
      <label class="label" style="margin-top:14px">📐 尺寸</label>
      <select id="size">
        <option value="1024x1024">1024×1024（正方形）</option>
        <option value="1536x1024" selected>1536×1024（橫向）</option>
        <option value="1024x1536">1024×1536（直向）</option>
      </select>
    </div>
    <div class="field">
      <label class="label" style="margin-top:14px">🎨 品質</label>
      <select id="quality">
        <option value="auto">Auto（自動）</option>
        <option value="low">Low（快速）</option>
        <option value="medium">Medium（標準）</option>
        <option value="high">High（精細）</option>
      </select>
    </div>
  </div>
</div>

<button class="generate" id="generateBtn" onclick="handleAction()">✦ 生成圖片</button>

<div class="status" id="status"></div>
<div class="result" id="result"></div>

<script>
let currentMode = 'generate';
let uploadedFile = null;
// 永遠存最新一張結果的 base64，確保第N次修改以第N-1次為準
let lastResultBase64 = null;

window.addEventListener('load', () => {
  const saved = localStorage.getItem('openai_api_key');
  if (saved) {
    document.getElementById('apiKey').value = saved;
    showSavedTag('✓ 已自動帶入儲存的 Key');
  }
});

function showSavedTag(msg) {
  const tag = document.getElementById('savedTag');
  tag.style.display = 'block';
  tag.textContent = msg;
}

function saveKey() {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { alert('請先輸入 API Key'); return; }
  localStorage.setItem('openai_api_key', key);
  showSavedTag('✓ 已記住，下次自動帶入');
}

function switchTab(mode) {
  currentMode = mode;
  document.getElementById('uploadSection').style.display = mode === 'edit' ? 'block' : 'none';
  document.getElementById('tabGenerate').className = 'tab-btn ' + (mode === 'generate' ? 'active' : 'inactive');
  document.getElementById('tabEdit').className = 'tab-btn ' + (mode === 'edit' ? 'active' : 'inactive');
  document.getElementById('generateBtn').textContent = mode === 'generate' ? '✦ 生成圖片' : '✎ 編輯圖片';
  document.getElementById('promptLabel').textContent = mode === 'generate' ? '圖片描述（Prompt）' : '修改描述';
  document.getElementById('prompt').placeholder = mode === 'generate'
    ? '例如：台灣阿里山的茶園，清晨薄霧，油畫風格，高品質'
    : '例如：把天空改成夕陽、幫人物換上西裝、加上白色背景';
}

function previewImage(event) {
  const file = event.target.files[0];
  if (!file) return;
  setUploadFile(file);
}

function setUploadFile(file) {
  uploadedFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    const row = document.getElementById('uploadRow');
    row.innerHTML = `
      <img class="preview-thumb" src="${e.target.result}" />
      <div class="upload-text" style="color:var(--text);font-size:0.82rem;">${file.name}</div>
      <button class="clear-btn" onclick="event.stopPropagation();clearImage()">✕ 移除</button>
      <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="previewImage(event)"/>
    `;
    row.onclick = () => document.getElementById('imageInput').click();
  };
  reader.readAsDataURL(file);
}

function clearImage() {
  uploadedFile = null;
  const row = document.getElementById('uploadRow');
  row.innerHTML = `
    <span style="font-size:1.4rem">📁</span>
    <div class="upload-text">點擊選擇圖片（PNG / JPG）</div>
    <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="previewImage(event)"/>
  `;
  row.onclick = () => document.getElementById('imageInput').click();
}

async function handleAction() {
  currentMode === 'generate' ? await generateImage() : await editImage();
}

async function generateImage() {
  const apiKey = document.getElementById('apiKey').value.trim();
  const prompt = document.getElementById('prompt').value.trim();
  const size = document.getElementById('size').value;
  const quality = document.getElementById('quality').value;
  const btn = document.getElementById('generateBtn');
  const status = document.getElementById('status');
  const result = document.getElementById('result');

  if (!apiKey) { status.className='status error'; status.textContent='請輸入 OpenAI API Key'; return; }
  if (!prompt) { status.className='status error'; status.textContent='請輸入圖片描述'; return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>生成中...';
  status.className = 'status loading';
  status.textContent = '正在呼叫 gpt-image-1，約需 15–30 秒...';
  result.innerHTML = '';

  try {
    const response = await fetch('https://api.openai.com/v1/images/generations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
      body: JSON.stringify({ model: 'gpt-image-1', prompt, n: 1, size, quality })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error?.message || '生成失敗');
    await showResult(data.data[0], prompt);
    status.className = 'status success';
    status.textContent = '✓ 生成成功！';
  } catch (err) {
    status.className = 'status error';
    status.textContent = '錯誤：' + err.message;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '✦ 生成圖片';
  }
}

async function editImage() {
  const apiKey = document.getElementById('apiKey').value.trim();
  const prompt = document.getElementById('prompt').value.trim();
  const size = document.getElementById('size').value;
  const btn = document.getElementById('generateBtn');
  const status = document.getElementById('status');
  const result = document.getElementById('result');

  if (!apiKey) { status.className='status error'; status.textContent='請輸入 OpenAI API Key'; return; }
  if (!uploadedFile) { status.className='status error'; status.textContent='請先上傳圖片'; return; }
  if (!prompt) { status.className='status error'; status.textContent='請輸入修改描述'; return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>編輯中...';
  status.className = 'status loading';
  status.textContent = '正在編輯圖片，約需 20–40 秒...';
  result.innerHTML = '';

  try {
    const pngFile = await convertToPng(uploadedFile);
    const formData = new FormData();
    formData.append('image[]', pngFile, 'image.png');
    formData.append('prompt', prompt);
    formData.append('model', 'gpt-image-1');
    formData.append('size', size);
    formData.append('n', '1');

    const response = await fetch('https://api.openai.com/v1/images/edits', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${apiKey}` },
      body: formData
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error?.message || '編輯失敗');
    await showResult(data.data[0], prompt);
    status.className = 'status success';
    status.textContent = '✓ 編輯成功！';
  } catch (err) {
    status.className = 'status error';
    status.textContent = '錯誤：' + err.message;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '✎ 編輯圖片';
  }
}

function convertToPng(file) {
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.width; canvas.height = img.height;
      canvas.getContext('2d').drawImage(img, 0, 0);
      canvas.toBlob(blob => {
        URL.revokeObjectURL(url);
        resolve(new File([blob], 'image.png', { type: 'image/png' }));
      }, 'image/png');
    };
    img.src = url;
  });
}

// 把圖片轉成 base64 存在記憶體，確保「繼續修改」永遠用最新這張
async function showResult(imageData, prompt) {
  const result = document.getElementById('result');
  let imgSrc = imageData.url ? imageData.url : ('data:image/png;base64,' + imageData.b64_json);

  // 統一轉成 base64 存起來（這是關鍵：每次結果都覆蓋 lastResultBase64）
  if (imageData.b64_json) {
    lastResultBase64 = 'data:image/png;base64,' + imageData.b64_json;
  } else {
    // 從 URL 抓回來轉 base64
    try {
      const res = await fetch(imgSrc);
      const blob = await res.blob();
      lastResultBase64 = await blobToBase64(blob);
    } catch(e) {
      lastResultBase64 = imgSrc; // fallback
    }
  }

  result.innerHTML = `
    <img src="${lastResultBase64}" alt="Generated image" />
    <div class="result-actions">
      <a class="download-btn" href="${lastResultBase64}" download="gpt-image-${Date.now()}.png">↓ 下載圖片</a>
      <button class="continue-btn" onclick="continueEdit()">✎ 繼續修改這張</button>
    </div>
    <div class="share-row">
      <button class="share-btn share-line" onclick="shareLine()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63h2.386c.349 0 .63.285.63.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63.349 0 .631.285.631.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.281.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/></svg>
        LINE
      </button>
      <button class="share-btn share-fb" onclick="shareFacebook()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Facebook
      </button>
      <button class="share-btn share-tw" onclick="shareTwitter()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.213 5.607 5.951-5.607zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        X
      </button>
      <button class="share-btn share-copy" onclick="copyImage()">
        📋 複製圖片
      </button>
    </div>
  `;
}

function blobToBase64(blob) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.readAsDataURL(blob);
  });
}

function continueEdit() {
  if (!lastResultBase64) { alert('無法取得圖片，請重試'); return; }

  // 把 base64 轉成 File 物件，設為新的上傳圖
  fetch(lastResultBase64)
    .then(r => r.blob())
    .then(blob => {
      const file = new File([blob], 'result.png', { type: 'image/png' });
      uploadedFile = file; // ← 覆蓋為最新結果
      switchTab('edit');
      setUploadFile(file);
      document.getElementById('prompt').value = '';
      document.getElementById('prompt').focus();
      window.scrollTo({ top: 300, behavior: 'smooth' });
    });
}
</script>
</body>
</html>
<script>
// 分享功能：LINE、Facebook、X、複製圖片
// 注意：社群平台無法直接分享本地 base64 圖片，需先下載再手動分享
// 所以我們提供「下載後開啟分享頁」的流程

function shareLine() {
  const text = encodeURIComponent('用 GPT Image 2.0 生成的圖片！');
  // 先觸發下載
  downloadResult();
  // 短暫延遲後開啟 LINE 分享（分享文字+連結）
  setTimeout(() => {
    window.open(`https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(location.href)}&text=${text}`, '_blank');
  }, 500);
}

function shareFacebook() {
  downloadResult();
  setTimeout(() => {
    window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}`, '_blank');
  }, 500);
}

function shareTwitter() {
  const text = encodeURIComponent('用 GPT Image 2.0 生成的圖片！ #AIArt #GPTImage');
  downloadResult();
  setTimeout(() => {
    window.open(`https://twitter.com/intent/tweet?text=${text}&url=${encodeURIComponent(location.href)}`, '_blank');
  }, 500);
}

async function copyImage() {
  try {
    const res = await fetch(lastResultBase64);
    const blob = await res.blob();
    await navigator.clipboard.write([
      new ClipboardItem({ 'image/png': blob })
    ]);
    alert('✓ 圖片已複製到剪貼簿！可直接貼到 LINE、Discord 等');
  } catch(e) {
    alert('複製失敗，請改用「下載圖片」後手動分享');
  }
}

function downloadResult() {
  if (!lastResultBase64) return;
  const a = document.createElement('a');
  a.href = lastResultBase64;
  a.download = `gpt-image-${Date.now()}.png`;
  a.click();
}
</script>
